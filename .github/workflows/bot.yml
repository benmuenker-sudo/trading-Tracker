name: Paper-Trading-Bot
# Drei Ausloeser, damit der Bot zuverlaessig weiterlaeuft:
#  1. schedule: GitHubs Zeitplan (best effort, startet manchmal verspaetet oder gar nicht)
#  2. Selbst-Anstoss: Jeder Lauf wartet bis zur naechsten Viertelstunde und startet dann den naechsten Lauf
#     (abschaltbar: Repository > Settings > Secrets and variables > Actions > Variables > BOT_CHAIN = off)
#  3. push auf main bzw. "Run workflow" von Hand startet die Kette (neu)
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Letzten Stand holen
        run: |
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git show origin/data:state.json > bot/state.json || rm -f bot/state.json
            git show origin/data:obs.json > bot/obs.json 2>/dev/null || rm -f bot/obs.json
          fi
      - name: Tests
        continue-on-error: true   # ein fehlgeschlagener Test soll den laufenden Bot nicht anhalten
        run: python3 bot/test_bot.py
      - name: Bot ausfuehren
        run: BOT_STATE=bot/state.json python3 bot/radar_bot.py
      - name: Stand speichern (Branch "data", immer nur ein Commit)
        run: |
          cp bot/state.json /tmp/state.json
          cp bot/obs.json /tmp/obs.json
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -rf -q . || true
          cp /tmp/state.json state.json
          cp /tmp/obs.json obs.json
          git add state.json obs.json
          git commit -q -m "Bot-Stand $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data-new:data
      - name: Naechsten Lauf anstossen (zur naechsten Viertelstunde)
        if: ${{ always() && vars.BOT_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 900 - $(date +%s) % 900 ))
          echo "Warte ${wait}s bis zur naechsten Viertelstunde"
          sleep "$wait"
          gh workflow run bot.yml --ref main
