<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#06080d" id="tcm">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krypto Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Krypto Radar</title>
<style>
:root{--bg:#06080d;--panel:#0b0f17;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.075);--line:rgba(255,255,255,.08);--text:#eaf0fb;--mute:#8592ab;--up:#20d08a;--down:#ff5470;--acc:#7c5cff;--acc2:#22d3ee;--gold:#ffc857;--pop:#0f1420;--top:rgba(6,8,13,.78);--th:#0d121c;--tape:rgba(0,0,0,.25);--shadow:rgba(0,0,0,.6);--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font:14.5px/1.5 Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 8% -8%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%),radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 60%),var(--bg)}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
select option{background:var(--pop)}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);background:var(--top);border-bottom:1px solid var(--line)}
.top-in{padding:10px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:19px;white-space:nowrap;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox{position:relative;flex:1;max-width:460px}
.sbox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;outline:none}
.sbox input:focus{border-color:var(--acc)}
#sr{position:absolute;top:44px;left:0;right:0;background:var(--pop);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:70vh;overflow:auto;z-index:50}
#sr .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}#sr .it:hover{background:var(--card2)}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:5px 12px 5px 6px;border-radius:30px;cursor:pointer;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.curs{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 10px;outline:none;cursor:pointer;font-weight:600}
.tape{overflow:hidden;border-top:1px solid var(--line);background:var(--tape);white-space:nowrap}
.tape-in{display:inline-block;padding:6px 0;animation:tp 120s linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tape span{margin:0 18px;font-size:12.5px;color:var(--mute)}.tape b{color:var(--text);font-weight:600;margin-right:5px}
@keyframes tp{to{transform:translateX(-50%)}}

.layout{display:grid;grid-template-columns:214px minmax(0,1fr);max-width:1560px;margin:auto}
.side{position:sticky;top:96px;align-self:start;padding:14px 10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
.side button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 12px;border-radius:12px;cursor:pointer;color:var(--mute);font-weight:500;text-align:left}
.side button i{font-style:normal;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--card);font-size:13px;flex:none}
.side button:hover{color:var(--text);background:var(--card)}
.side button.on{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 50%,transparent),color-mix(in srgb,var(--acc2) 22%,transparent));box-shadow:0 0 0 1px var(--line) inset}
.side .grp{font-size:10.5px;letter-spacing:1.4px;color:var(--mute);padding:14px 12px 4px;font-weight:700}
.side .foot{margin-top:14px;font-size:11px;color:var(--mute);padding:8px 12px}
main{padding:18px 18px 70px;min-width:0}
@media(max-width:900px){
 .layout{display:block}
 .side{position:fixed;bottom:0;left:0;right:0;top:auto;max-height:none;flex-direction:row;overflow-x:auto;background:rgba(6,8,13,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px;z-index:40}
 .side button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px;white-space:nowrap}.side .grp,.side .foot{display:none}
 .sbox{max-width:none}.logo{display:none}
}
h2{margin:28px 0 12px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 small{color:var(--mute);font-weight:400;font-size:12.5px}
h2 .r{margin-left:auto;font-size:13px}
.sub{color:var(--mute);font-size:13px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(8px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat .l{color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px}
.stat .v{font-size:22px;font-weight:700;margin-top:3px}
.gauge{height:8px;border-radius:8px;background:linear-gradient(90deg,#ff5470,#ffc857,#20d08a);position:relative;margin-top:10px}
.gauge i{position:absolute;top:-4px;width:4px;height:16px;background:#fff;border-radius:2px;transform:translateX(-2px);box-shadow:0 0 8px #fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.coin{position:relative;transition:.18s;cursor:pointer}
.coin:hover{transform:translateY(-3px);background:var(--card2);box-shadow:0 12px 34px color-mix(in srgb,var(--acc) 22%,transparent)}
.hd{display:flex;align-items:center;gap:10px}
.hd img,.ph{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;background:#fff1}
.ph{background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:700;color:#fff}
.nm{font-weight:600;line-height:1.2}.sy{color:var(--mute);font-size:12px;text-transform:uppercase}
.sc{margin-left:auto;font-weight:800;font-size:13px;padding:3px 9px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.star{background:none;border:0;cursor:pointer;font-size:19px;color:var(--mute);padding:2px 4px}
.star.on{color:var(--gold);text-shadow:0 0 12px rgba(255,200,87,.6)}
.big{font-size:20px;font-weight:700;margin-top:10px}
.rw{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:12.5px;margin-top:3px}.rw b{color:var(--text);font-weight:500}
.up{color:var(--up)!important}.down{color:var(--down)!important}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600}
.pill.up{background:rgba(32,208,138,.13)}.pill.down{background:rgba(255,84,112,.13)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mute);white-space:nowrap}
.tag.hot{background:rgba(255,84,112,.16);color:#ff8fa3}.tag.risk{background:rgba(255,200,87,.14);color:var(--gold)}.tag.good{background:rgba(32,208,138,.14);color:#6ee7b3}.tag.blue{background:rgba(34,211,238,.14);color:var(--acc2)}
svg.sp7{width:100%;height:38px;margin-top:8px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.inp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;outline:none;min-width:160px}
.inp:focus{border-color:var(--acc)}
.btn{background:linear-gradient(135deg,var(--acc),#5b8cff);border:0;border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;color:#fff;white-space:nowrap}
.btn.g{background:var(--card);border:1px solid var(--line);color:var(--text)}.btn.s{padding:5px 11px;font-size:12.5px;border-radius:9px}
.btn:hover{filter:brightness(1.15)}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--mute);white-space:nowrap}
.chip:hover{color:var(--text)}.chip.on{color:#fff;border-color:var(--acc);background:color-mix(in srgb,var(--acc) 28%,transparent)}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tl th:nth-child(-n+3),.tl td:nth-child(-n+3){text-align:left}
th{color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--th)}
th:hover{color:var(--text)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--card2)}tbody tr:last-child td{border-bottom:0}
td .c{display:flex;align-items:center;gap:9px}td .c img,td .c .ph{width:24px;height:24px;font-size:11px}
.pg{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.news a{color:inherit;display:block}.news a:hover{text-decoration:none}
.news .glass{margin-bottom:10px;transition:.18s;display:flex;gap:14px}.news .glass:hover{background:var(--card2)}
.news img{width:92px;height:68px;border-radius:10px;object-fit:cover;flex:none}
.news h3{margin:0 0 4px;font-size:14.5px}.news p{margin:0;color:var(--mute);font-size:12.8px}
.mt{font-size:12px;color:var(--mute);margin-top:5px}
.note{border-left:3px solid var(--gold);background:rgba(255,200,87,.07);padding:10px 14px;border-radius:8px;color:var(--mute);font-size:12.5px;margin:12px 0}
.note.b{border-color:var(--acc2);background:rgba(34,211,238,.07)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(7px);z-index:80;display:none;place-items:center;padding:14px}
.modal.on{display:grid}
.mbox{background:var(--pop);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:780px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.x{float:right;background:var(--card);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
@media(max-width:700px){.two{grid-template-columns:1fr}.sp{display:none}}
.err{color:var(--down)}
.sk{height:130px;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.hold{width:96px;padding:5px 8px;min-width:0;border-radius:8px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:58px;grid-auto-flow:dense;gap:4px}
.tile{color:#fff;border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;transition:.15s;border:1px solid rgba(255,255,255,.06)}
.tile:hover{transform:scale(1.03);z-index:2;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tile b{font-size:13px;text-transform:uppercase}.tile span{font-size:12px;opacity:.92}
.t1{grid-column:span 4;grid-row:span 3}.t1 b{font-size:22px}.t1 span{font-size:16px}
.t2{grid-column:span 3;grid-row:span 2}.t2 b{font-size:17px}
.t3{grid-column:span 2;grid-row:span 2}.t3 b{font-size:14px}
.t4{grid-column:span 2}
@media(max-width:700px){.heat{grid-template-columns:repeat(6,1fr)}.t1{grid-column:span 6}.t2{grid-column:span 3}.t3,.t4{grid-column:span 2}}
.ch{position:relative;height:230px;margin:10px 0 4px}
.ch svg{width:100%;height:100%;display:block}
.ch .tip{position:absolute;top:0;pointer-events:none;background:var(--pop);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap;transform:translateX(-50%)}
.lst .li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.lst .li:last-child{border:0}.lst .li:hover{background:var(--card2)}
.lst .li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst img,.lst .ph{width:26px;height:26px;font-size:11px}
.hb{height:7px;border-radius:5px;background:var(--card2);overflow:hidden;display:flex}
.hb i{display:block;height:100%}
.rng{position:relative;height:6px;border-radius:5px;background:linear-gradient(90deg,var(--down),var(--gold),var(--up));margin:12px 0 4px}
.rng i{position:absolute;top:-5px;width:4px;height:16px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.brow .bn{width:130px;color:var(--mute);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bb{flex:1;height:9px;background:var(--card2);border-radius:6px;overflow:hidden}.brow .bb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.brow .bv{width:84px;text-align:right;flex:none}
.dv{position:relative;flex:1;height:9px;background:var(--card2);border-radius:6px}
.dv:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dv i{position:absolute;top:0;height:100%;border-radius:6px}
#toasts{position:fixed;right:16px;top:100px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--pop);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:320px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateX(30px)}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lg div{font-size:13px;margin:3px 0}
.tvbox{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin:14px 0}
.cv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
@media(max-width:700px){.cv{grid-template-columns:1fr}}
.metal{font-size:19px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
/* Handy & Tablet: sichere Ränder (iPhone-Notch), grössere Tippflächen, kein Zoom beim Tippen */
.top-in{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
@media(max-width:900px){
 .side{padding-bottom:max(6px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
 .side button{min-height:46px}
 main{padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
 input,select,textarea{font-size:16px!important}
 .btn,.chip{min-height:38px}
}
@media(prefers-reduced-motion:reduce){.tape-in{animation:none}html{scroll-behavior:auto}}
.inst{display:none}
/* Helles Design */
:root[data-theme=light]{--bg:#f3f5fa;--panel:#fff;--card:#fff;--card2:rgba(20,30,70,.06);--line:rgba(20,30,70,.11);--text:#151c30;--mute:#5a6680;--up:#0a9b61;--down:#d42f4d;--gold:#b7791f;--pop:#fff;--top:rgba(255,255,255,.85);--th:#eef1f7;--tape:rgba(20,30,70,.04);--shadow:rgba(20,30,70,.18)}
:root[data-theme=light] body::before{background:radial-gradient(900px 520px at 8% -8%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--acc2) 10%,transparent),transparent 60%),var(--bg)}
:root[data-theme=light] .glass{box-shadow:0 1px 2px rgba(20,30,70,.06),0 6px 18px rgba(20,30,70,.05);backdrop-filter:none}
:root[data-theme=light] .chip.on,:root[data-theme=light] .side button.on{color:var(--text)}
:root[data-theme=light] .coin:hover{background:#fff}
:root[data-theme=light] .tag.hot{color:#c0264a}:root[data-theme=light] .tag.good{color:#0a7d4e}
:root[data-theme=light] .gauge i,:root[data-theme=light] .rng i{background:#151c30;box-shadow:0 0 0 2px #fff}
.tbtn{background:var(--card);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
/* Unterer Menüstreifen (Handy) */
#bnav{display:none}
#more{display:none}
@media(max-width:900px){
 .side{display:none!important}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--top);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
 #bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;color:var(--mute);font-size:11.5px;cursor:pointer;min-height:54px}
 #bnav button i{font-style:normal;font-size:21px;line-height:1}
 #bnav button.on{color:var(--text);background:color-mix(in srgb,var(--acc) 22%,transparent)}
 #more.on{display:block;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
 #more h3{margin:22px 4px 10px;font-size:12px;letter-spacing:1.3px;color:var(--mute)}
 #more .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 #more .mg button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-size:12.5px;cursor:pointer;text-align:center;min-height:84px}
 #more .mg button i{font-style:normal;font-size:24px}
 #more .mg button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
 #more .mtop{display:flex;align-items:center;justify-content:space-between}
 #more .mtop b{font-size:20px}
 .who span{display:none}.who{padding:4px}
 .top-in{gap:8px}
}
/* Handy: mehr Luft, grössere Schrift, weniger Gedränge */
@media(max-width:700px){
 body{font-size:16px;line-height:1.55}
 main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
 h2{margin:32px 0 14px;font-size:19px}
 .glass{padding:18px;border-radius:20px}
 .grid,.cols{gap:16px;grid-template-columns:1fr}
 .stats{grid-template-columns:1fr 1fr;gap:12px}
 .stat .l{font-size:11px}.stat .v{font-size:20px}
 .stats>.glass:first-child:nth-last-child(odd){grid-column:1/-1}
 .big{font-size:24px}
 .rw{font-size:14px;margin-top:6px}
 .sub{font-size:14px}
 .bar{gap:10px;margin-bottom:16px}
 .chip{padding:9px 15px;font-size:14px}
 .btn{padding:12px 18px;font-size:15px}.btn.s{padding:8px 13px;font-size:14px}
 .inp{padding:12px 14px}
 .note{font-size:14px;padding:13px 15px}
 .tag{font-size:12px;padding:3px 10px}
 .news .glass{gap:12px;padding:14px}.news img{width:84px;height:84px}.news h3{font-size:15.5px}.news p{font-size:14px}
 table{min-width:760px}th,td{padding:14px 14px}
 .mbox{border-radius:24px;padding:20px}
 .ch{height:210px}
 #toasts{left:12px;right:12px;top:auto;bottom:calc(92px + env(safe-area-inset-bottom))}
 .toast{max-width:none}
 .sbox input{padding:11px 14px}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="logo">🛰️ Krypto Radar</div>
    <div class="sbox"><input id="gs" placeholder="Coin, Aktie, ETF, Gold, Währung …  ( / )" autocomplete="off" oninput="gsearch(this.value)" onkeydown="if(event.key==='Enter')gsearchEnter(this.value)"><div id="sr"></div></div>

    <div style="padding-top:10px">${rw('Name',esc(t.name))}${rw('Einstieg',pr(t.entry)+' ('+dts(t.t_in)+')')}${rw('Ausstieg',pr(t.exit)+' ('+dts(t.t_out)+')')}${rw('Einsatz',usd(t.size))}${rw('Gebühren/Finanzierung',usd(t.fees||0))}${rw('Bester / schlechtester Punkt',t.mfe!=null?sgn(t.mfe)+'% / '+sgn(t.mae)+'%':'–')}${rw('Score beim Einstieg',t.score)}
    <div class="tags">${(t.why||[]).map(w=>`<span class="tag blue">${esc(w)}</span>`).join('')}</div></div></details>`).join('')+'</div>':'';
}
function botTrades(b){
  const all=(b.trades||[]).slice().reverse(),F={all:()=>true,long:t=>t.side!=='short',short:t=>t.side==='short',win:t=>t.pnl>0,loss:t=>t.pnl<=0};
  const list=all.filter(F[S.btf]),st=b.stats||{},br=st.by_reason||{};
  const chips=[['all','Alle'],['long','▲ Long'],['short','▼ Short'],['win','Gewinne'],['loss','Verluste']].map(([k,l])=>`<button class="chip ${S.btf===k?'on':''}" onclick="S.btf='${k}';S.btn=25;render(true)">${l} <span class="sub">${all.filter(F[k]).length}</span></button>`).join('');
  const reasons=Object.keys(br).map(r=>`<div class="rw"><span>${esc(r)}</span><b>${br[r].n}× · Ø ${sgn(br[r].avg_pct||0)}% · <span class="${br[r].pnl>=0?'up':'down'}">${usd(br[r].pnl)}</span></b></div>`).join('');
  return`<div class="bar">${chips}</div>${list.length?botTradeList(list,S.btn):'<div class="glass sub">Keine Trades in dieser Auswahl.</div>'}
  ${list.length>S.btn?`<div class="pg"><button class="btn g" onclick="S.btn+=25;render(true)">Mehr anzeigen (${list.length-S.btn} weitere)</button></div>`:''}
  ${all.length?`<div class="bar" style="margin-top:14px"><button class="btn g s" onclick="botCsv()">⬇ Alle Trades als CSV (Excel)</button></div>`:''}
  ${reasons?`<h2>Nach Ausstiegsgrund</h2><div class="glass">${reasons}</div>`:''}`;
}
function botCsv(){
  const b=S.bot;if(!b)return;const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Symbol','Name','Richtung','Einstieg Zeit','Ausstieg Zeit','Einstiegspreis','Ausstiegspreis','Einsatz USD','Gewinn USD','Gewinn %','Grund','Tage','Gebühren USD','Score']];
  (b.trades||[]).forEach(t=>rows.push([t.sym,t.name,t.side||'long',t.t_in,t.t_out,t.entry,t.exit,t.size,t.pnl,t.pnl_pct,t.reason,t.days,t.fees,t.score]));
  dl('paper-bot-trades.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv');
}
function botSig(b){
  const all=b.signals||[],L=all.filter(x=>S.sf==='all'||(x.side||'long')===S.sf);
  const chips=[['all','Alle'],['long','▲ Long'],['short','▼ Short']].map(([k,l])=>`<button class="chip ${S.sf===k?'on':''}" onclick="S.sf='${k}';render(true)">${l}</button>`).join('');
  return`<p class="sub">Die 40 besten Bewertungen im letzten Lauf. Einstieg ab ${40} Punkten (Short ab ${45}) und mindestens 2 bestätigenden Signalen.</p><div class="bar">${chips}</div>
  <div class="glass lst">`+(L.map(x=>`<div class="li" style="align-items:flex-start;flex-wrap:wrap"><span class="n" style="flex:1;min-width:150px;white-space:normal;overflow:visible"><b>${esc(x.sym)}</b> ${sideTag(x.side||'long')} <span class="sub">${esc(x.name)}${x.kind==='dex'?' · DEX':x.rank<9999?' · #'+x.rank:''}</span><div class="sub" style="font-size:12px">${pr(x.price)} · 1h ${pt(x.c1h)} · 24h ${pt(x.c24h)} · 7T ${pt(x.c7d)}</div></span><span class="pill" style="background:var(--card2);font-size:15px">${x.score}</span><div class="tags" style="width:100%;margin-top:2px">${Object.keys(x.comp||{}).filter(k=>x.comp[k]>=.4).map(k=>`<span class="tag ${x.side==='short'?'hot':'blue'}">${esc((x.side==='short'?LBLS:LBL)[k])} ${Math.round(x.comp[k]*100)}</span>`).join('')}<span class="tag">${x.confirm} Signale</span></div></div>`).join('')||'<span class="sub">Noch keine Daten.</span>')+'</div>';
}
function botTr(b){
  const ev=(b.events||[]).slice(-25).reverse().map(e=>{const T={open:'eröffnet',add:'stockt auf',reduce:'reduziert',close:'schließt',flip:'dreht auf'}[e.type]||e.type;return`<div class="li"><span class="n"><b>${esc(e.trader)}</b> ${T} <b>${esc(e.coin)}</b> ${sideTag(e.side)}</span><span class="sub">${usd(e.value)} · ${ago(Date.parse(e.t))}</span></div>`}).join('');
  const trd=(b.traders||[]).map(t=>`<div class="glass"><div class="nm">${esc(t.name)}</div><div class="sub">Konto ${usd(t.av)} · Monat ${pt(t.month_roi*100)} · Gesamtgewinn ${usd(t.all_pnl)}</div><div class="tags">${(t.positions||[]).map(p=>`<span class="tag ${p.side==='long'?'good':'hot'}">${esc(p.coin)} ${p.side==='long'?'▲':'▼'} ${usd(p.value)}</span>`).join('')||'<span class="sub">keine großen Positionen</span>'}</div></div>`).join('');
  return`<p class="sub">Erfolgreiche Trader auf Hyperliquid (öffentliche Daten), automatisch ausgewählt: Gewinn in Woche, Monat und gesamt, mindestens 100.000 $ Konto, keine Market-Maker. Deren Positionen sind ein Signal unter mehreren.</p>
  <h2>Letzte Bewegungen</h2>${ev?`<div class="glass lst">${ev}</div>`:'<div class="glass sub">Noch keine Bewegungen – sie erscheinen, sobald sich bei den Tradern etwas ändert.</div>'}<h2>Beobachtete Trader <small>${(b.traders||[]).length}</small></h2><div class="grid">${trd}</div>`;
}
function botInfo(b){
  const inf=b.info||{},st=b.stats||{},w=b.weights||{},wl=w.long||w,ws=w.short||{},bc=st.by_comp||{},cl=bc.long||bc,cs=bc.short||{};
  const row=(k,d)=>d?` <span class="sub">(${d.n}× · ${d.win_rate}% · Ø ${sgn(d.avg_pct||0)}%)</span>`:'';
  const wts=Object.keys(BOTL).map(k=>`<div class="rw" style="flex-wrap:wrap"><span>${BOTL[k]}</span><b>Long ×${(wl[k]||1).toFixed(2)}${row(k,cl[k])} · Short ×${((ws[k])||1).toFixed(2)}${row(k,cs[k])}</b></div>`).join('');
  const hl=(inf.headlines||[]).map(h=>`<div class="li"><span class="n" style="white-space:normal">${esc(h.title)}<div class="sub" style="font-size:12px">${esc(h.src)} · ${ago(Date.parse(h.t))}</div></span></div>`).join('');
  return`<div class="cols"><div class="glass"><b>Trend-Coins (CoinGecko)</b>${(inf.trending||[]).map(x=>`<div class="rw"><span>${esc(x.name)} <span class="sub">${esc(x.sym)}</span></span><b>${pt(x.c24h)}</b></div>`).join('')||'<p class="sub">keine Daten</p>'}</div>
   <div class="glass"><b>Oft in den Nachrichten (24 h)</b>${(inf.buzz||[]).map(x=>`<div class="rw"><span>${esc(x.name)} <span class="sub">${esc(x.sym)}</span></span><b>${x.n}× genannt</b></div>`).join('')||'<p class="sub">keine Treffer</p>'}</div></div>
  <h2>Aktuelle Schlagzeilen</h2><div class="glass lst">${hl||'<span class="sub">keine Daten</span>'}</div>
  <h2>Was der Bot gelernt hat <small>Gewicht je Signalart, 1,00 = Standard (0,5–1,5). Gelernt wird erst ab 8 Trades pro Signalart und Richtung.</small></h2><div class="glass">${wts}</div>
  <h2>Regeln <small>zum Nachlesen</small></h2><div class="glass sub" style="line-height:1.7">Startkapital 10.000 $ · max. 12 Positionen, davon max. 4 Shorts · 1–3 % je Einstieg (Short 70 %, DEX-Token ~35 %) · Gebühr 0,1 % pro Seite plus Kursabweichung nach Coin-Größe · Shorts: 0,03 % Finanzierung pro Tag · Stopp 8 % · Ziel +30 % (Short −25 %) · Trailing ab +10 % mit 8 % Abstand · Zeit-Stopp nach 10 Tagen unter +5 % · Keine neuen Longs bei Bitcoin −6 % (24 h) oder −15 % (7 Tage) · Keine neuen Shorts bei Bitcoin +4 % (24 h) · derselbe Coin erst nach 3 Tagen wieder. Der Bot läuft alle 15 Minuten auf GitHub-Servern, unabhängig von deinem PC; Stopps werden nur bei jedem Lauf geprüft.</div>`;
}
function vBot(){
  const b=S.bot;
  const url=`<details style="margin-top:14px"><summary class="sub" style="cursor:pointer">Datenquelle ändern</summary><div class="bar" style="margin-top:8px"><input class="inp" id="bu" value="${esc(LS.g('boturl',BOTURL))}" style="min-width:260px"><button class="btn s" onclick="LS.s('boturl',$('bu').value.trim()||BOTURL);S.botT=0;loadBot(true)">Speichern</button></div></details>`;
  if(!b)return`<h2>🤖 Paper-Bot <small>Simulation – kein echtes Geld</small></h2><div class="glass"><p>${S.botErr?'Noch keine Bot-Daten gefunden ('+esc(S.botErr)+').':'Lade Bot-Daten …'}</p><p class="sub">Der Bot läuft automatisch auf GitHub. Falls er noch nie lief: auf GitHub im Repository ▸ <b>Actions</b> ▸ „Paper-Trading-Bot“ ▸ <b>Run workflow</b>. Danach hier neu laden.</p><button class="btn" onclick="loadBot(true)">Neu laden</button>${url}</div>`;
  const tabs=BOTTABS.map(([k,l])=>`<button class="chip ${S.btab===k?'on':''}" onclick="botTab('${k}')">${l}${k==='pos'?` <span class="sub">${(b.positions||[]).length}</span>`:k==='trades'?` <span class="sub">${(b.trades||[]).length}</span>`:''}</button>`).join('');
  const body={ov:botOv,pos:botPos,trades:botTrades,sig:botSig,tr:botTr,info:botInfo}[S.btab]||botOv;
  return`<h2>🤖 Paper-Bot <small>Simulation – kein echtes Geld · Lauf ${b.runs} · Stand ${ago(Date.parse(b.updated))}</small><span class="r"><a href="#" onclick="loadBot(true);return false">↻ neu laden</a></span></h2>
  <div class="bar" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">${tabs}</div>
  ${S.btab==='ov'?`<div class="note">Der Bot handelt nur im Kopf: virtuelle ${usd(b.start_equity)}, echte Kurse, mit Gebühren und Kursabweichung – auf steigende (Long) und fallende Kurse (Short). Ergebnisse der Vergangenheit sagen nichts über die Zukunft. Kein Anlagetipp.</div>`:''}
  ${body(b)}${url}`;
}

/* =====================  HELL / DUNKEL  ===================== */
const themeNow=()=>{const t=LS.g('theme','auto');return t==='auto'?(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):t};
function applyTheme(){const t=themeNow();document.documentElement.dataset.theme=t;const m=$('tcm');if(m)m.content=t==='light'?'#f3f5fa':'#06080d';const b=$('thm');if(b)b.textContent=t==='light'?'🌙':'☀️'}
function toggleTheme(){LS.s('theme',themeNow()==='light'?'dark':'light');applyTheme();$('vtv').dataset.k='';render(true)}
try{matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>{if(LS.g('theme','auto')==='auto'){applyTheme();$('vtv').dataset.k='';render(true)}})}catch(e){}
/* =====================  HANDY-MENÜ  ===================== */
const BN=['home','mhome','watch','news'];
function moreOpen(){const m=$('more');m.classList.add('on');let h='<div class="mtop"><b>Menü</b><button class="tbtn" onclick="moreClose()" aria-label="Schließen">✕</button></div>',g=false;
  TABS.forEach(t=>{if(t[0]==='grp'){if(g)h+='</div>';h+=`<h3>${t[1]}</h3><div class="mg">`;g=true}else h+=`<button class="${t[0]===S.tab?'on':''}" onclick="moreClose();go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`});
  m.innerHTML=h+'</div><p class="sub" style="margin-top:26px;text-align:center">Kein Anlagetipp.</p>'}
function moreClose(){$('more').classList.remove('on')}
function bnavHtml(){const T=Object.fromEntries(TABS.filter(t=>t[0]!=='grp').map(t=>[t[0],t]));const short={home:'Krypto',mhome:'Märkte',watch:'Watchlist',news:'News'};
  return BN.map(k=>`<button class="${k===S.tab?'on':''}" onclick="go('${k}')"><i>${T[k][1]}</i>${short[k]}</button>`).join('')+`<button class="${BN.includes(S.tab)?'':'on'}" onclick="moreOpen()"><i>☰</i>Mehr</button>`}

/* =====================  APP-INSTALLATION / OFFLINE  ===================== */
let instEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('inst').style.display='inline-block'});
window.addEventListener('appinstalled',()=>{instEv=null;$('inst').style.display='none'});
function installApp(){if(!instEv)return;instEv.prompt();instEv.userChoice.finally(()=>{instEv=null;$('inst').style.display='none'})}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

if(innerWidth<700)$('gs').placeholder='Suchen …';
applyTheme();applyAcc();nav();render();
loadCoins();tabLoad();want(W('s'),true);loadFx();loadMetals();initStore();
setInterval(()=>{if(document.hidden)return;loadCoins(true);tabLoad();want(W('s'),true);loadMetals();checkAlerts()},4*60*1000);
</script>
